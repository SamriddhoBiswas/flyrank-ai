services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Inside the compose network the database is reachable by service name "db"
      DATABASE_URL: postgres://postgres:dev@db:5432/tasks
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tasks
    volumes:
      - taskdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  taskdata:
